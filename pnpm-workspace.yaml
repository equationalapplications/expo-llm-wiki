packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  prisma: true

nodeLinker: hoisted

# Supply-chain gate: reject versions published < 14 days ago at any
# lockfile-regen resolution (mirrors curated-thoughts; external guidance:
# "only accept dependencies older than 2 weeks"). Not evaluated under
# --frozen-lockfile.
minimumReleaseAge: 20160          # minutes; 14 days

# CT-parity first-party exclusion. All current first-party lockfile entries
# are workspace:* links (never registry-resolved), so this is
# defense-in-depth, not a deadlock fix; it only becomes load-bearing if a
# first-party dep is ever consumed from the registry. Removed post-approval
# in PR #152 (CodeRabbit Finding), restored by Kurt's decision 2026-09-16 —
# see docs/superpowers/specs/2026-09-16-supply-chain-age-gate-design.md §3.1.
minimumReleaseAgeExclude:
  - '@equationalapplications/*'
  - image-size
  # Kurt waived the 14-day gate for undici on 2026-10-28 — patches
  # (8.12.2 / 7.30.1 / 6.29.1) were published 2026-10-15, one day short.
  # Waiver rode PR #298's CI block; the overrides below pin the patched
  # versions regardless.
  - undici

# Single source of truth for overrides. Do NOT add `pnpm.overrides` to the root
# package.json: when both exist, pnpm 10 silently applies only the package.json
# set, which left every advisory pin below inert.
overrides:
  # CT #231 companion: image-size <2.0.3 carries GHSA-5p2g-fcmc-qvqq /
  # GHSA-w3rx-r6r6-pgpr (DoS via ICNS/JXL/HEIF parsers). 2.0.3+ patched;
  # the 14-day age gate does not apply here (see exclude below) because
  # both fixed versions were published 2026-09-14 and the advisories are
  # already exploitable in the wild.
  'image-size@<2.0.3': ^2.0.3
  # GHSA-qw65-cvwx-89v3 / GHSA-58mr-gqgx-xq4g (HIGH): fast-uri <3.1.7;
  # GHSA-hrr3-gc8f-f4qj (MEDIUM, host case normalization): fast-uri <3.1.8.
  # 3.1.8 published 2026-09-15, clears the 14-day age gate.
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  '@babel/core@<=7.29.0': 7.29.6
  # GHSA-mrhx-c7xc-m3w5 (HIGH): zod memory exhaustion validating oversized
  # constrained collections; 4.6.6 published 2026-10-11, clears the 14-day
  # age gate. Scoped to the 4.x line — @expo/cli's zod 3.25.76 has no
  # in-range patch and stays on the pnpm-audit allowlist (issue #278).
  'zod@>=4.0.0 <4.6.6': 4.6.6
  # undici HIGH advisories (GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26,
  # GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm — fetch/redirect issues;
  # patches published 2026-10-15, age gate waived by Kurt 2026-10-28,
  # see minimumReleaseAgeExclude above). One entry per major line in the
  # tree; in-range minors only.
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.2': 8.12.2
  # @semantic-release/github pins undici EXACTLY at 7.29.1; the range
  # selector above does not match an exact spec, so pin it directly.
  'undici@7.29.1': 7.30.1
  '@ungap/structured-clone': ^1.3.1
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p (HIGH): brace-expansion
  # >=4.0.0 <5.0.11 (DoS via uncontrolled recursion); GHSA-q2hr-2g5m-vwhr
  # (MEDIUM, quadratic `{a},b}` rewrite): <5.0.12. 5.0.12 published
  # 2026-09-14, clears the 14-day age gate; supersedes the earlier
  # 5.0.11 and >=5.0.0 <5.0.6 floors.
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  deepmerge-ts@<8.0.0: 8.0.0
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  fast-uri@>=2.0.0 <3.0.0: 2.4.4
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  postcss@<8.5.23: ^8.5.23
  mysql2@<3.23.1: 3.23.1
  react: 19.3.0
  react-dom: 19.3.0
  # Dependabot #146 (CRITICAL, CVE-2026-102422): shell-quote >=1.8.4 <1.11.0
  # command injection via a line terminator in a token after a { comment }
  # token. Reach: react-devtools-core (react-native dev inspector) —
  # devDependency graph only, never shipped. 1.11.0 published 2026-09-29,
  # clears the 14-day age gate (15.8 days).
  'shell-quote@>=1.8.4 <1.11.0': ^1.11.0
  # Dependabot #144 (HIGH, CVE-2026-93749): source-map-js >=1.0.0 <1.2.2
  # event-loop DoS via indexed source-map section offsets. Reach: build
  # tooling (css-tree, magicast) — devDependency graph only, never shipped.
  # 1.2.2 published 2026-09-30, clears the 14-day age gate (14.3 days).
  'source-map-js@>=1.0.0 <1.2.2': ^1.2.2
  # Dependabot #148/#150 (2x CRITICAL, GHSA-8r5x-fm3f-whwj / GHSA-p8wg-vrv2-v86f)
  # + #149 (MEDIUM, GHSA-xw65-4hp5-5hc7): handlebars <4.7.10 JS injection via
  # compile()/lookup helpers. Reach: semantic-release > conventional-changelog-
  # writer — release tooling only, devDependency graph; templates are never
  # attacker-supplied in this pipeline. 4.7.10 published 2026-10-05, clears the
  # 14-day age gate (15.2 days).
  'handlebars@<4.7.10': ^4.7.10
  tar@<7.5.21: ^7.5.21
  # GHSA-gfhx-hw2g-v5hg (LOW): serialize-javascript >=7.1.1 <7.1.2 XSS via
  # unsanitized serialized strings. Reach: apps/scopelab > vite-plugin-pwa >
  # workbox-build > @rollup/plugin-terser. 7.1.2 published 2026-09-23,
  # clears the 14-day age gate.
  'serialize-javascript@>=7.1.1 <7.1.2': 7.1.2
  undici@>=7.0.0 <7.29.1: 7.29.1
  uuid@<11.1.1: 11.1.1
  # Dependabot #151/#152/#153 (MEDIUM, GHSA-587h-7wmj-h5pm): vite <8.1.6 /
  # 8.3.0-8.3.2. 8.1.6 published 2026-10-06 04:51 UTC, clears the 14-day age
  # gate 2026-10-20 04:51 UTC (14.92 days); 8.3.3 (scopelab devDep) published
  # 2026-10-06 04:10 UTC, clears 2026-10-20 04:10 UTC. Dev-only: vite never
  # ships to production bundles here.
  vite@>=8.0.0 <8.1.6: 8.1.6
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.21.0: 8.21.0
