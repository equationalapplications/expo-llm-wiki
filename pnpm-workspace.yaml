packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  prisma: true

nodeLinker: hoisted

# Single source of truth for overrides. Do NOT add `pnpm.overrides` to the root
# package.json: when both exist, pnpm 10 silently applies only the package.json
# set, which left every advisory pin below inert.
overrides:
  '@babel/core@<=7.29.0': 7.29.6
  '@ungap/structured-clone': ^1.3.1
  brace-expansion@>=5.0.0 <5.0.6: 5.0.6
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  fast-uri@>=2.0.0 <3.0.0: 2.4.4
  js-yaml@<3.15.0: 3.15.0
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  postcss@<8.5.23: ^8.5.23
  react: 19.2.8
  react-dom: 19.2.8
  shell-quote@<1.9.0: ^1.9.0
  tar@<7.5.21: ^7.5.21
  undici@>=7.0.0 <7.29.0: 7.29.0
  uuid@<11.1.1: 11.1.1
  vite@>=8.0.0 <=8.0.15: 8.0.16
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.21.0: 8.21.0
