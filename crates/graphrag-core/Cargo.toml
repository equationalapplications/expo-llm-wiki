[package]
name = "graphrag-core"
version = "0.1.0"
edition = "2021"
description = "Portable native GraphRAG engine core (read-only fact-neighborhood slice)"
license = "MIT"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
