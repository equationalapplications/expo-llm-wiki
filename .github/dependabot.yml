version: 2
updates:
  # The npm ecosystem also maintains pnpm-lock.yaml. Sub-manifests are listed
  # explicitly: a root-only entry would never open PRs for packages/* or
  # apps/* specifiers. `directory` and `directories` are mutually exclusive.
  - package-ecosystem: npm
    directories: ["/", "/packages/*", "/apps/*"]
    schedule:
      interval: weekly
    cooldown:
      # Matches the 14-day pnpm minimumReleaseAge gate (policy alignment, not
      # enforcement; Dependabot does not read minimumReleaseAge). KNOWN BYPASS
      # (accepted, spec §6 Q4): security updates skip cooldown, and their
      # lockfile is never gate-checked in CI because frozen installs skip
      # resolution.
      default-days: 14
    groups:
      # Group ALL update types (major included) into a single PR per cycle so
      # major bumps no longer arrive as individual PRs per dependency.
      npm-all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      # conventionalcommits preset >=9 requires conventional-changelog-writer@9,
      # but @semantic-release/release-notes-generator 14.x still pins writer@8
      # and the release job fails at generateNotes ("Missing helper"). Unpin
      # once release-notes-generator 15 ships stable.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) port, and its npm package has no
      # classic JS compiler API (ts.sys and ts.createProgram are undefined).
      # tsup 8.5.1 bundles rollup-plugin-dts 6.1.1, which needs that API, so
      # every `tsup --dts` build crashes ("reading 'useCaseSensitiveFileNames'").
      # Unpin once the declaration build runs on TS 7: a tsup release with
      # TS 7 support, or a move to a bundler that uses @typescript/typescript6.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      # Same full grouping for GitHub Actions.
      actions-all:
        update-types:
          - major
          - minor
          - patch

# ── Security decision register (investigated alerts NOT auto-fixed) ─────────
# Key: <package>|<alert-number>. status ∈ deferred | wontfix | fixed-awaiting-scan
# deferred = an upstream parent pins/blocks the patched version; retry on parent
#            upgrade. wontfix = risk accepted after investigation.
# This register is documentation + sweep cross-check. Where Dependabot's fix
# would break the build, add an `ignore` above AND cite the register key.
# Re-opening of a registered alert = register review trigger, not noise.
# Entries:
# - tar|48, tar|72, tar|73, tar|74, tar|75, tar|78, tar|133, tar|134, tar|135,
#   tar|136, tar|137, tar|138: fixed-awaiting-scan — fastembed 3.0.0 (#254)
#   dropped its tar dependency, so the 'fastembed>tar: 6.2.1' override and
#   tar@6.2.1 are gone from pnpm-lock.yaml. Remove this entry once Dependabot
#   closes the alerts on main.
#   GHSAs (alert numbers can be reassigned; these are the stable handles):
#   48 vmf3-w455-68vh, 72 8x88-c5mf-7j5w, 73 w8wr-v893-vjvp, 74 gvwx-54wh-qm9j,
#   75 23hp-3jrh-7fpw, 78 r292-9mhp-454m, 133 8qq5-rm4j-mr97,
#   134 r6q2-hw4h-h46w, 135 34x7-hfp2-rc4v, 136 83g3-92jg-28cx,
#   137 qffp-2rhf-9h96, 138 9ppj-qmqm-q256 (each prefixed GHSA-).
