name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.10.0"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/*' build

      - name: Build ScopeLab
        working-directory: apps/scopelab
        run: pnpm build

      - name: Build Wiki Demo
        working-directory: apps/wiki-demo
        run: pnpm build

      - name: Assemble unified output
        run: |
          mkdir -p pages-dist/scopelab pages-dist/wiki-demo
          cp -r apps/scopelab/dist/. pages-dist/scopelab/
          cp -r apps/wiki-demo/dist/. pages-dist/wiki-demo/
          touch pages-dist/.nojekyll
          cat > pages-dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=wiki-demo/">
            <title>expo-llm-wiki</title>
          </head>
          <body>
            <p><a href="wiki-demo/">Wiki Demo</a> | <a href="scopelab/">ScopeLab</a></p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          publish_branch: gh-pages
          force_orphan: true
