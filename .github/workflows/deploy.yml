name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.0"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: pnpm -r --filter './packages/*' build

      - name: Build ScopeLab
        working-directory: apps/scopelab
        run: pnpm build

      - name: Build Wiki Demo
        working-directory: apps/wiki-demo
        run: pnpm build

      - name: Assemble unified output
        run: |
          mkdir -p pages-dist/scopelab pages-dist/wiki-demo
          cp -r apps/scopelab/dist/. pages-dist/scopelab/
          cp -r apps/wiki-demo/dist/. pages-dist/wiki-demo/
          touch pages-dist/.nojekyll
          cat > pages-dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=wiki-demo/">
            <title>expo-llm-wiki</title>
          </head>
          <body>
            <p><a href="wiki-demo/">Wiki Demo</a> | <a href="scopelab/">ScopeLab</a></p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d231e62369c1b3a6a
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          publish_branch: gh-pages
          force_orphan: true
