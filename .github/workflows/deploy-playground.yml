name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}playground/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # playground is a standalone app outside the root pnpm workspace; npm is intentional
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        working-directory: playground
        run: npm ci

      - name: Build
        working-directory: playground
        run: npm run build

      - name: Prepare pages structure
        run: |
          mkdir -p pages/playground
          cp -r playground/dist/. pages/playground/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deploy
        uses: actions/deploy-pages@v4
