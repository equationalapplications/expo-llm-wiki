name: Test

on:
  push:
    branches: [main]
  pull_request:

# Grant contents: read so actions/checkout can authenticate repo reads
# even if the repo is later flipped to private, or if a submodule fetch
# is added. This workflow never pushes; the broader token is unused here.
permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Never push from the test job — drop the GITHUB_TOKEN from
          # .git/config so a transitive dependency or later step cannot
          # accidentally read it.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      # Fresh-clone gate for scopelab's vitest source aliases (#131, issue
      # #135): this is the ONLY test run that executes before `pnpm run
      # build`, so it is the only place where the workspace deps resolve
      # through apps/scopelab/vitest.config.ts aliases rather than built
      # dist/ output. If a future change reintroduces a workspace import
      # that is not source-aliased there, this step fails the way it
      # failed pre-#131 ("Failed to resolve entry" from unresolved dist/
      # imports) instead of shipping broken for real fresh clones while
      # every CI run stays green on the pre-built tree.
      - run: pnpm --filter scopelab test

      # Supply-chain gate (audit 2026-08-24, L-4). Fails the build on new
      # high/critical advisories. Known-unpatched exceptions are allowlisted
      # by GHSA id below with a tracking comment — keep this list minimal.
      - name: pnpm audit (high+, allowlisted exceptions)
        env:
          # Allowlisted GHSA ids, comma-separated. Keep minimal + commented.
          AUDIT_ALLOWLIST: "GHSA-5p2g-fcmc-qvqq,GHSA-w3rx-r6r6-pgpr,GHSA-86w9-cpqp-85rv,GHSA-vfj7-8cjw-p6xm" # image-size DoS (<=2.0.2), ICNS + JXL/HEIF parsers; node-forge PKCS#1 v1.5 nested DigestAlgorithm (<=1.4.0); braces stack-exhaustion (<=3.0.3) — all three via expo-sqlite > expo > @expo/cli transitive; no upstream patch yet as of 2026-10-05
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level=high --json > /tmp/audit.json || true
          node -e '
            const data = require("/tmp/audit.json");
            const advisories = Object.values(data.advisories ?? {});
            const allow = process.env.AUDIT_ALLOWLIST.split(",");
            const unhandled = advisories.filter(a => !allow.includes(a.github_advisory_id));
            if (unhandled.length) {
              for (const a of unhandled) console.error("AUDIT FAIL: " + a.github_advisory_id + " " + a.module_name + " " + a.severity + " - " + a.title);
              process.exit(1);
            }
            console.log("Audit clean (allowlisted: " + allow.join(", ") + ")");
          '

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm test

      - name: Verify README GraphRAG SQL is in sync with EdgeRepository
        run: |
          REPO=packages/core/src/repositories/EdgeRepository.ts
          DOC=README.md
          # Presence checks: both files must still contain each SQL fragment.
          for pat in "WITH RECURSIVE" "instr(w.visited" "WHEN 'certain' THEN 2"; do
            grep -q -- "$pat" "$REPO" || { echo "Missing '$pat' in EdgeRepository"; exit 1; }
            grep -q -- "$pat" "$DOC" || { echo "Missing '$pat' in README.md"; exit 1; }
          done
          # Content checks: the depth guard and final ranking clause must match
          # semantically, not just be present — this is what catches an operator
          # change (e.g. `<` -> `<=`) or a reordered ORDER BY going undetected.
          extract() {
            # $1 = file, $2 = grep pattern; strips SQL comments/template-literal
            # prefix interpolation and collapses whitespace so the two files'
            # differing styles (raw TS vs abridged, commented README) compare equal.
            grep -- "$2" "$1" | head -1 \
              | sed -E 's/--.*$//; s/\$\{this\.prefix\}/llm_wiki_/g; s/[[:space:]]+/ /g; s/^ //; s/ $//'
          }
          repo_depth=$(extract "$REPO" "WHERE w.depth")
          doc_depth=$(extract "$DOC" "WHERE w.depth")
          if [ "$repo_depth" != "$doc_depth" ]; then
            echo "Depth guard clause differs:"; echo "  EdgeRepository: $repo_depth"; echo "  README:         $doc_depth"; exit 1
          fi
          repo_order=$(extract "$REPO" "ORDER BY depth ASC")
          doc_order=$(extract "$DOC" "ORDER BY depth ASC")
          if [ "$repo_order" != "$doc_order" ]; then
            echo "ORDER BY clause differs:"; echo "  EdgeRepository: $repo_order"; echo "  README:         $doc_order"; exit 1
          fi

      # Audit runs LAST so a single high-severity advisory introduced by
      # this PR cannot mask build / typecheck / test failures.
      #
      # The gate only fails on advisories that have a real upstream
      # patch available (the patched_versions field is not the
      # `<0.0.0>` placeholder). Advisories without a fix — currently
      # `image-size` GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq pulled
      # in via expo → @expo/metro → metro, with no patched release —
      # surface as warnings so Dependabot continues to track them
      # instead of permanently blocking this workflow.
      - name: Audit (fail only on advisories with an upstream patch)
        env:
          # Allowlisted GHSA ids, comma-separated. Keep minimal + commented.
          # The fastembed-pinned tar 6.2.1 chain has known-but-not-applicable
          # advisories (crafted-archive DoS); fastembed only extracts its own
          # model archive from Hugging Face, never attacker-controlled input.
          # Remove when fastembed ships a tar-7-compatible release.
          AUDIT_ALLOWLIST: "GHSA-34x7-hfp2-rc4v,GHSA-8qq5-rm4j-mr97,GHSA-83g3-92jg-28cx,GHSA-qffp-2rhf-9h96,GHSA-9ppj-qmqm-q256,GHSA-r6q2-hw4h-h46w,GHSA-23hp-3jrh-7fpw,GHSA-8x88-c5mf-7j5w,GHSA-r292-9mhp-454m" # fastembed's transitive tar 6.2.1 — scoped exception `'fastembed>tar': 6.2.1` in pnpm-workspace.yaml
        shell: bash
        run: |
          set -e
          pnpm audit --audit-level=high --json > /tmp/audit.json || true
          # Run Python directly (no command substitution): under `set -e`,
          # a non-zero exit inside $(...) would terminate the shell before
          # the captured diagnostics can be printed, masking the real
          # cause. Python prints warnings for unfixable advisories (no
          # upstream patch) before raising SystemExit(1) only if any
          # fixable advisory exists. The script is written to a file first
          # to avoid the heredoc / multi-line -c indentation pitfalls that
          # bit an earlier draft of this step.
          cat > /tmp/audit-classify.py <<'PYEOF'
          import json, os, sys
          data = json.load(open("/tmp/audit.json", encoding="utf-8"))
          advisories = data.get("advisories") or {}
          allow = [s for s in (os.environ.get("AUDIT_ALLOWLIST", "")).split(",") if s]
          if allow:
              print(f"Audit allowlist (GHSA): {', '.join(allow)}")
          advisories = {k: a for k, a in advisories.items() if a.get("github_advisory_id") not in allow}
          # pnpm's "no patch yet" sentinel: patched_versions is a placeholder
          # like "<0.0.0" (an opening bracket followed by 0.0.0). Anything
          # that doesn't match that prefix is a real version range and the
          # advisory is considered fixable.
          def is_unfixable(a):
              pv = a.get("patched_versions") or ""
              return pv.startswith("<0.0.0")
          fixable = [a for a in advisories.values() if not is_unfixable(a)]
          unfixable = [a for a in advisories.values() if is_unfixable(a)]
          for a in unfixable:
              print(f"WARNING: {a['module_name']} ({a.get('url', '')}) has no upstream patch")
          if fixable:
              for a in fixable:
                  print(f"HIGH: {a['module_name']} ({a.get('url', '')}) — fix to {a.get('patched_versions')}")
              sys.exit(1)
          PYEOF
          python3 /tmp/audit-classify.py && echo "No fixable high-severity advisories." || exit 1
  # Rust side of the native GraphRAG vertical slice (crates/graphrag-core).
  # Sibling job, NOT needs: test — runs in parallel with the pnpm job so a
  # JS regression never gates a Rust one (or vice versa).
  rust-test:
    name: rust-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Respect crates/graphrag-core/rust-toolchain.toml (channel 1.96.0).
      # SHA is the head of dtolnay/rust-toolchain@master at the time of
      # writing (2026-09-18) — @master has no stable tag to pin instead.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0

      # SHA = Swatinem/rust-cache@v2.9.2 (verified via GitHub tags API).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/graphrag-core

      - name: cargo test (graphrag-core)
        working-directory: crates/graphrag-core
        run: cargo test --locked

      # Smoke: the headless proof example must keep running end-to-end.
      - name: cargo run --example proof (smoke)
        working-directory: crates/graphrag-core
        run: cargo run --locked --example proof

      # Smoke: the REQ-PERF-01 bench harness scaffold runs and exits 0
      # (timing values are machine-dependent and are NOT asserted).
      - name: bench-traversal harness smoke (REQ-PERF-01)
        working-directory: crates/graphrag-core
        run: cargo run --locked --bin bench-traversal
