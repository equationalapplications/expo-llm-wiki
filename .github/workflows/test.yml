name: Test

on:
  push:
    branches: [main]
  pull_request:

# Grant contents: read so actions/checkout can authenticate repo reads
# even if the repo is later flipped to private, or if a submodule fetch
# is added. This workflow never pushes; the broader token is unused here.
permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          # Never push from the test job — drop the GITHUB_TOKEN from
          # .git/config so a transitive dependency or later step cannot
          # accidentally read it.
          persist-credentials: false

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.0.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.10.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm test

      # Audit runs LAST so a single high-severity advisory introduced by
      # this PR cannot mask build / typecheck / test failures.
      #
      # The gate only fails on advisories that have a real upstream
      # patch available (the patched_versions field is not the
      # `<0.0.0>` placeholder). Advisories without a fix — currently
      # `image-size` GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq pulled
      # in via expo → @expo/metro → metro, with no patched release —
      # surface as warnings so Dependabot continues to track them
      # instead of permanently blocking this workflow.
      - name: Audit (fail only on advisories with an upstream patch)
        shell: bash
        run: |
          set -e
          pnpm audit --audit-level=high --json > /tmp/audit.json || true
          UNFIXABLE=$(python3 -c "
          import json
          data = json.load(open('/tmp/audit.json'))
          advisories = data.get('advisories') or {}
          # An advisory is 'fixable' iff its patched_versions is something
          # other than the pnpm-sentinel '<0.0.0>' meaning 'no patch yet'.
          fixable = [a for a in advisories.values() if a.get('patched_versions') != '<0.0.0>']
          if fixable:
              for a in fixable:
                  print(f\"  HIGH: {a['module_name']} ({a.get('url','')}) — fix to {a.get('patched_versions')}\")
              raise SystemExit(1)
          ")
          if [ -n "$UNFIXABLE" ]; then
            echo "$UNFIXABLE"
            exit 1
          fi
          echo "No fixable high-severity advisories."