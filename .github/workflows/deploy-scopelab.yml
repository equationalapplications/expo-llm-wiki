name: Deploy ScopeLab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/scopelab/**'
      - '.github/workflows/deploy-scopelab.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}scopelab/
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: pnpm -r build

      - name: Build ScopeLab
        working-directory: apps/scopelab
        run: pnpm build

      - name: Setup pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/scopelab/dist

      - id: deploy
        uses: actions/deploy-pages@v4
