name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write # create GitHub release, push release commit
  issues: write # comment on issues resolved by release
  pull-requests: write # comment on PRs resolved by release
  id-token: write # npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Get current version
        id: pre_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish workspace packages
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ "$NEW_VERSION" = "${{ steps.pre_version.outputs.version }}" ]; then
            echo "No new release, skipping workspace package publish"
            exit 0
          fi
          # Update all workspace package versions to match the new root version
          for pkg in core expo react; do
            node -e "
              const fs = require('fs');
              const pkgPath = 'packages/$pkg/package.json';
              const p = JSON.parse(fs.readFileSync(pkgPath));
              p.version = '$NEW_VERSION';
              fs.writeFileSync(pkgPath, JSON.stringify(p, null, 2) + '\n');
            "
          done
          # Publish each workspace package (pnpm replaces workspace:* with resolved versions)
          for pkg in core expo react; do
            pnpm --filter "./packages/$pkg" publish --no-git-checks --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
