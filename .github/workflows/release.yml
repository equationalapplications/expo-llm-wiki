name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # create GitHub release, push release commit
  issues: write # comment on issues resolved by release
  pull-requests: write # comment on PRs resolved by release
  id-token: write # npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.0.0
        with:
          version: 9.12.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Get current version
        id: pre_version
        run: |
          node -p "require('./package.json').version" | xargs -I{} echo "version={}" >> $GITHUB_OUTPUT

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish all packages
        run: |
          # Determine the released version from a release tag that points at the
          # checked-out commit. This keeps reruns pinned to the code being
          # published instead of accidentally picking a newer unrelated tag from
          # elsewhere in the repository.
          RELEASE_VERSION=$(git tag --points-at HEAD --sort=-version:refname --list 'v[0-9]*' | head -1 | sed 's/^v//')
          if [ -z "$RELEASE_VERSION" ]; then
            echo "No release tag found for the checked-out commit; semantic-release did not create a new release for this revision. Nothing to publish."
            exit 0
          fi
          echo "Release version: ${RELEASE_VERSION}"

          package_name() {
            node -p "require(process.argv[1]).name" "$1"
          }

          publish_if_needed() {
            PACKAGE_JSON_PATH="$1"
            shift

            PACKAGE_NAME=$(package_name "$PACKAGE_JSON_PATH")
            PACKAGE_VERSION="${RELEASE_VERSION}"

            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published, skipping"
              return 0
            fi

            # Patch the on-disk package.json to RELEASE_VERSION before publishing.
            # On a workflow rerun the checkout is still at the pre-release SHA, so the
            # file on disk still carries the old version even though the git tag is correct.
            # Without this patch pnpm publish would use the stale version from disk.
            # Variables are passed as env vars (not interpolated into the script) to avoid
            # any risk of injection from unexpected characters in paths or version strings.
            PKG_PATH="${PACKAGE_JSON_PATH}" PKG_VERSION="${RELEASE_VERSION}" node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync(process.env.PKG_PATH, 'utf8'));
              p.version = process.env.PKG_VERSION;
              fs.writeFileSync(process.env.PKG_PATH, JSON.stringify(p, null, 2) + '\n');
            "

            echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            "$@"
          }

          # Publish in dependency order so each package exists on npm before dependents are published.
          # pnpm publish replaces workspace:* dependency ranges with the real version at pack time.
          # Workspace package versions are already set by semantic-release's prepare phase.
          publish_if_needed "./packages/core-llm-tools/package.json" pnpm --filter "./packages/core-llm-tools" publish --no-git-checks --access public
          publish_if_needed "./packages/core/package.json" pnpm --filter "./packages/core" publish --no-git-checks --access public
          publish_if_needed "./packages/react/package.json" pnpm --filter "./packages/react" publish --no-git-checks --access public
          publish_if_needed "./packages/expo/package.json" pnpm --filter "./packages/expo" publish --no-git-checks --access public
          publish_if_needed "./packages/prisma-outbox/package.json" pnpm --filter "./packages/prisma-outbox" publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
