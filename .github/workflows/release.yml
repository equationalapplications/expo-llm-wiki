name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write # create GitHub release, push release commit
  issues: write # comment on issues resolved by release
  pull-requests: write # comment on PRs resolved by release
  id-token: write # npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Get current version
        id: pre_version
        run: node -p "require('./package.json').version" | xargs -I{} echo "version={}" >> $GITHUB_OUTPUT

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish all packages
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ "$NEW_VERSION" = "${{ steps.pre_version.outputs.version }}" ]; then
            echo "No new release, skipping publish"
            exit 0
          fi
          # Publish in dependency order so each package exists on npm before dependents are published.
          # pnpm publish replaces workspace:* dependency ranges with the real version at pack time.
          # Workspace package versions are already set by semantic-release's prepare phase.
          pnpm --filter "./packages/core" publish --no-git-checks --access public
          pnpm --filter "./packages/react" publish --no-git-checks --access public
          pnpm --filter "./packages/expo" publish --no-git-checks --access public
          # Publish the root compatibility package last (its workspace:* deps are now on npm)
          pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
