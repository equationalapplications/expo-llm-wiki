name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write # create GitHub release, push release commit
  issues: write # comment on issues resolved by release
  pull-requests: write # comment on PRs resolved by release
  id-token: write # npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Get current version
        id: pre_version
        run: node -p "require('./package.json').version" | xargs -I{} echo "version={}" >> $GITHUB_OUTPUT

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish all packages
        run: |
          # Do not gate publish retries on the checked-out package.json version.
          # On a rerun after semantic-release has already created the tag/release,
          # the repository still contains the original version, so we must rely on
          # per-package npm checks below to skip already-published packages and
          # retry any packages that failed to publish previously.

          package_name() {
            node -p "require(process.argv[1]).name" "$1"
          }

          latest_release_version() {
            # Read version from the latest git tag so that reruns after semantic-release
            # has already created the tag use the released version rather than the
            # pre-release version from the checked-out package.json.
            git tag --sort=-version:refname --list 'v[0-9]*' | head -1 | sed 's/^v//'
          }

          publish_if_needed() {
            PACKAGE_JSON_PATH="$1"
            shift

            PACKAGE_NAME=$(package_name "$PACKAGE_JSON_PATH")
            PACKAGE_VERSION=$(latest_release_version)

            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published, skipping"
              return 0
            fi

            echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            "$@"
          }

          # Publish in dependency order so each package exists on npm before dependents are published.
          # pnpm publish replaces workspace:* dependency ranges with the real version at pack time.
          # Workspace package versions are already set by semantic-release's prepare phase.
          publish_if_needed "./packages/core/package.json" pnpm --filter "./packages/core" publish --no-git-checks --access public
          publish_if_needed "./packages/react/package.json" pnpm --filter "./packages/react" publish --no-git-checks --access public
          publish_if_needed "./packages/expo/package.json" pnpm --filter "./packages/expo" publish --no-git-checks --access public
          # Publish the root compatibility package last (its workspace:* deps are now on npm)
          publish_if_needed "./package.json" pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
